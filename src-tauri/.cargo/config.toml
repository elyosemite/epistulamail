# O OpenSSL embutido no SQLCipher (rusqlite, feature bundled-sqlcipher-vendored-openssl) precisa de um
# Perl nativo para configurar o build. No Windows, scripts/setup-build-tools.ps1 baixa um Strawberry
# Perl portátil para .tools/ e define OPENSSL_SRC_PERL para a sessão e para o ambiente do usuário.
# No Linux, o Perl do sistema é usado. O caminho não pode ficar aqui: o Cargo não tem [env] por
# sistema, e um caminho .exe do Windows quebraria o build no Linux.
