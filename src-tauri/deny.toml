# Política de dependências do Epistula (US2, entregável 2). Rode: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
# Avisos aceitos: todos transitivos e só entram no build Linux (GTK/WebKit do Tauri e
# Secret Service do keyring). Nenhum é vulnerabilidade; reavaliar a cada atualização do Tauri.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: só em tempo de compilação, via gtk (Linux)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant sem manutenção: via zbus (Tauri/keyring no Linux)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names sem manutenção: via zbus (Tauri/keyring no Linux)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive sem manutenção: via zbus (Tauri/keyring no Linux)" },
]

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
