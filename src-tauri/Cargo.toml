[package]
name = "epistula"
version = "1.0.2"
description = "Cliente de e-mail desktop Epistula"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "epistula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
dotenvy = "0.15"
ammonia = "4"
# SQLCipher (SQLite 3 cifrado, AES-256) com OpenSSL embutido: nenhuma DLL do sistema. Decisão D2 da US3.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# Envio (US7): MIME e SMTP com XOAUTH2. Sem "hostname": o nome do computador não vai no EHLO nem no Message-ID.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
tauri-plugin-autostart = "2"
# Chaves e tokens zerados na memória ao sair de uso (US10, CA5).
zeroize = "1.9"
# Senha do Epistula (US10, CA2): Argon2id (RFC 9106) deriva a chave que envolve, com AES-256-GCM, a
# chave do banco e os refresh tokens. Crates do RustCrypto, auditados.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# OpenPGP (US13): rPGP, Rust puro, MIT/Apache, auditado; `pqc` traz ML-KEM e ML-DSA (RFC 9980).
pgp = { version = "0.21", features = ["pqc"] }
# Hash do WKD (busca de chaves OpenPGP pelo domínio): SHA-1 é o que a especificação pede.
sha1 = "0.10"
# Tamanho das chaves RSA na tela (o rPGP já traz o crate).
rsa = { version = "0.9", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-single-instance = "2"
# Seletor nativo de arquivo e pasta para importar e-mails (US15). Usado só pelo Rust: a interface não
# recebe permissão de diálogo, e o caminho escolhido não passa por um <input type=file>.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# S/MIME (US14, D2 da US13): o mesmo OpenSSL que o SQLCipher já compila (CMS, PKCS#12, X.509, CSR).
openssl = "0.10"
# Duas funções do CMS que o crate `openssl` não expõe (quem assinou e os certificados que vieram junto).
openssl-sys = "0.9"
foreign-types = "0.3"
# Importar arquivos do Outlook (US15): `.pst` pelo leitor da Microsoft (MIT, só leitura, MS-PST) e
# `.msg` (Compound File Binary, MS-CFB).
outlook-pst = "1.2"
cfb = "0.15"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
# Raízes de confiança do Windows para o S/MIME (US14, D6 da US13).
schannel = "0.1"
# Tirar o app dos relatórios de erro do Windows (US10, CA5).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ErrorReporting", "Win32_System_StationsAndDesktops", "Win32_Storage_FileSystem"] }

# Argon2id sem otimização levaria vários segundos por tentativa no build de desenvolvimento e nos testes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Instalador da release (.github/workflows/release.yml): sem símbolos de depuração no .exe e com otimização entre crates.
[profile.release]
lto = "thin"
strip = "symbols"
