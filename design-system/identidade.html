<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar, badge e lozenge · Epistula Design System</title>
<meta name="description" content="Pessoas, contagens e status.">
<script>try{var t=localStorage.getItem('epistula-ds-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="docs.css">
</head>
<body data-page="identidade">
<div class="doc">
  <nav class="doc-nav" id="doc-nav" aria-label="Índice"></nav>
  <main>
    <section class="ds-section" id="identidade">
        <div class="ds-head">
          <p class="eyebrow">ADS · Avatar, Badge, Lozenge</p>
          <h1>Avatar, badge e lozenge</h1>
          <p class="lede">O avatar identifica pessoas. O badge conta coisas, como não lidas na pasta. O lozenge mostra o status de uma mensagem. Não use um no lugar do outro: badge é sempre número, e lozenge é sempre uma palavra.</p>
        </div>
        <div class="stage">
          <div class="states">
            <figure class="state"><div class="row"><span class="avatar avatar--xs">YM</span><span class="avatar avatar--sm avatar--teal">PH</span><span class="avatar avatar--purple">MC</span><span class="avatar avatar--lg avatar--green">BA</span></div><figcaption><b>Avatar</b>20 · 24 · 32 · 40px</figcaption></figure>
            <figure class="state"><div class="avatar-group"><span class="avatar avatar--sm avatar--purple">MC</span><span class="avatar avatar--sm avatar--teal">PH</span><span class="avatar avatar--sm avatar--orange">RD</span><span class="avatar avatar--sm">+4</span></div><figcaption><b>Grupo</b>participantes da conversa</figcaption></figure>
            <figure class="state"><div class="row"><span class="badge">12</span><span class="badge badge--primary">3</span><span class="badge badge--important">99+</span><span class="badge badge--added">+2</span></div><figcaption><b>Badge</b>padrão · primário · importante · adicionado</figcaption></figure>
          </div>
        </div>
        <div class="stage">
          <div class="states">
            <figure class="state"><div class="row"><span class="lozenge">Arquivada</span><span class="lozenge lozenge--success">Entregue</span><span class="lozenge lozenge--removed">Falhou</span><span class="lozenge lozenge--inprogress">Enviando</span><span class="lozenge lozenge--new">Novo</span><span class="lozenge lozenge--moved">Agendada</span></div><figcaption><b>Lozenge sutil</b>uso padrão, em linha com o texto</figcaption></figure>
            <figure class="state"><div class="row"><span class="lozenge lozenge--bold">Arquivada</span><span class="lozenge lozenge--bold lozenge--success">Entregue</span><span class="lozenge lozenge--bold lozenge--removed">Falhou</span><span class="lozenge lozenge--bold lozenge--inprogress">Enviando</span><span class="lozenge lozenge--bold lozenge--new">Novo</span><span class="lozenge lozenge--bold lozenge--moved">Agendada</span></div><figcaption><b>Lozenge forte</b>só quando o status é o principal da tela</figcaption></figure>
          </div>
        </div>
      </section>
  </main>
</div>
<script src="docs.js"></script>
</body>
</html>
